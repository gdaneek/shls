# Static discovery needs no plugins or external coordinator. Compose starts
# the seed process first (not a health dependency); existing members rejoin
# from their persistent metadata. Blank peers retry while the seed boots.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq
cluster_formation.discovery_retry_limit = 60
cluster_formation.discovery_retry_interval = 1000
cluster_partition_handling = pause_minority

# Small educational workload, not a throughput-tuned production cluster.
raft.wal_max_size_bytes = 32000000
