name: mini-checkers

services:
  frontend:
    build: ./frontend
    image: mini-checkers-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    networks:
      public:
        ipv4_address: 10.10.1.3
    depends_on:
      game-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  game-api:
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: .
      target: game-api
    image: mini-checkers-game-api:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: mini_checkers
      POSTGRES_USER: mini_checkers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      CACHE_TTL_SECONDS: 60
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: mini_checkers
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      EVENTS_QUEUE: game.events
    networks:
      public:
        ipv4_address: 10.10.1.2
      data:
        ipv4_address: 10.10.2.2
      messaging:
        ipv4_address: 10.10.3.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "6", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 7s
      start_period: 30s
      retries: 5

  event-worker:
    restart: unless-stopped
    stop_grace_period: 20s
    build:
      context: .
      target: event-worker
    image: mini-checkers-event-worker:latest
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: mini_checkers
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      EVENTS_QUEUE: game.events
    networks:
      messaging:
        ipv4_address: 10.10.3.4
    depends_on:
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/event-worker", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    restart: unless-stopped
    stop_grace_period: 30s
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mini_checkers
      POSTGRES_USER: mini_checkers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      data:
        ipv4_address: 10.10.2.3
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mini_checkers", "-d", "mini_checkers"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7.4-bookworm
    # Cache only: PostgreSQL is the source of truth, so no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      data:
        ipv4_address: 10.10.2.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    stop_grace_period: 30s
    image: rabbitmq:4.1
    # A fixed node name keeps the data in the volume usable after recreation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mini_checkers
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      messaging:
        ipv4_address: 10.10.3.3
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:

# Network segments. Fixed subnets, addresses and bridge names are referenced
# by the firewall rules in infrastructure/firewall/mini-checkers.nft.
# data and messaging are internal: no gateway, no route to other segments.
networks:
  public:
    driver_opts:
      com.docker.network.bridge.name: mc-public
    ipam:
      config:
        - subnet: 10.10.1.0/24
          gateway: 10.10.1.1
  data:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: mc-data
    ipam:
      config:
        - subnet: 10.10.2.0/24
          gateway: 10.10.2.1
  messaging:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: mc-msg
    ipam:
      config:
        - subnet: 10.10.3.0/24
          gateway: 10.10.3.1
