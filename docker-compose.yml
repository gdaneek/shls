name: mini-checkers

services:
  game-api:
    build:
      context: .
      dockerfile: services/game-api/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/hello"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mini_checkers
      POSTGRES_USER: mini_checkers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mini_checkers", "-d", "mini_checkers"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mini_checkers
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  rabbitmq-data:
