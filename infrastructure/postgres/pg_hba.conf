# Local administration remains available only inside the database containers.
local all all trust
# API and the two trusted PostgreSQL nodes / maintenance job.
host all mini_checkers 10.10.2.2/32 scram-sha-256
host all mini_checkers 10.10.2.3/32 scram-sha-256
host all mini_checkers 10.10.2.5/32 scram-sha-256
host all mini_checkers 10.10.2.6/32 scram-sha-256
# Long-running replication uses a separate, non-superuser role.
host replication mini_checkers_repl 10.10.2.3/32 scram-sha-256
host replication mini_checkers_repl 10.10.2.5/32 scram-sha-256
