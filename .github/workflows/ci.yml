name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake gcovr git \
            libhiredis-dev libjsoncpp-dev libpq-dev libssl-dev uuid-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Coverage report
        run: |
          mkdir -p build/coverage/html
          gcovr --root . --filter 'src/' --print-summary build
          gcovr --root . --filter 'src/' --html-details build/coverage/html/index.html build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/html/
          if-no-files-found: error
